<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>給絆Kizuna的一封信</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%23e8b85c' d='M25 9a12 12 0 1 0 7 19a10 10 0 1 1-7-19z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="stylesheet" href="board.css?v=2">
</head>
<body>
  <!-- 夜空：星星（canvas）、月亮、吉他弦 -->
  <div class="sky" aria-hidden="true">
    <canvas id="sky"></canvas>
    <div class="moon"><span class="moon-crater c1"></span><span class="moon-crater c2"></span><span class="moon-crater c3"></span></div>
    <svg class="guitar" id="guitar" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
      <g class="headstock">
        <path class="headstock-body" d="M-40 800 C 40 790, 120 780, 196 790 L 214 990 C 140 1000, 40 1010, -40 1020 Z"/>
        <rect class="nut" x="198" y="800" width="16" height="182" rx="3" transform="rotate(-4 206 891)"/>
        <g class="pegs">
          <circle cx="58" cy="826" r="13"/><circle cx="118" cy="818" r="13"/><circle cx="170" cy="812" r="13"/>
          <circle cx="58" cy="988" r="13"/><circle cx="118" cy="980" r="13"/><circle cx="170" cy="972" r="13"/>
        </g>
      </g>
      <g class="strings" id="strings"></g>
    </svg>
  </div>

  <div class="music-ctrl" id="musicCtrl">
    <button class="volume-btn" id="volumeBtn" type="button" aria-label="調整音量" aria-expanded="false" aria-controls="volumePop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9.2a4 4 0 0 1 0 5.6M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
    </button>
    <button class="music-toggle" id="musicToggle" type="button" aria-pressed="true" aria-label="背景音樂：開">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="note" d="M9 18.5a2.5 2.5 0 1 1-2.5-2.5c.9 0 1.7.3 2.5.8V5l11-2v12.5a2.5 2.5 0 1 1-2.5-2.5c.9 0 1.7.3 2.5.8V7.2L9 9.2z"/><path class="slash" d="M3 3l18 18"/></svg>
      <span class="music-label" id="musicLabel">音樂</span>
    </button>
    <div class="volume-pop" id="volumePop" hidden>
      <input type="range" id="volumeSlider" min="0" max="100" step="1" aria-label="背景音樂音量">
      <span class="volume-num" id="volumeNum" aria-hidden="true"></span>
    </div>
  </div>

  <main class="stage">
    <!-- 信封 -->
    <section class="scene scene-envelope" id="sceneEnvelope">
      <button class="envelope" id="envelope" type="button" aria-label="拆開信封">
        <span class="env-back"></span>
        <span class="env-letter"><span class="env-letter-line"></span><span class="env-letter-line"></span><span class="env-letter-line short"></span></span>
        <svg class="env-front" viewBox="0 0 160 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 L80 56 L160 0 V100 H0 Z"/></svg>
        <span class="env-flap"><svg viewBox="0 0 160 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 H160 L80 60 Z"/></svg></span>
        <span class="env-seal" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M25 9a12 12 0 1 0 7 19a10 10 0 1 1-7-19z"/></svg></span>
        <span class="env-address">給 絆Kizuna</span>
      </button>
      <p class="env-hint" id="envHint">點一下，拆開這封信</p>
    </section>

    <!-- 信紙 -->
    <section class="scene scene-letter" id="sceneLetter" hidden>
      <div class="paper" id="paper" tabindex="-1">
        <div class="pages" id="pages" aria-live="polite"></div>
        <div class="paper-foot">
          <button class="prev is-off" id="prevBtn" type="button" aria-label="上一頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6"/></svg><span class="prev-label">上一頁</span></button>
          <ol class="progress" id="progress" aria-label="進度"></ol>
          <span class="progress-num" id="progressNum" aria-hidden="true"></span>
          <button class="next" id="nextBtn" type="button">下一頁<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </section>
  </main>

  <!-- 慶祝特效（成績頁） -->
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <!-- 禮物影片 -->
  <div class="video-layer" id="videoLayer" role="dialog" aria-modal="true" aria-label="禮物影片" hidden>
    <div class="video-frame">
      <div id="ytPlayer"></div>
      <video id="giftVideo" playsinline preload="metadata" controls></video>
    </div>
    <p class="video-error" id="videoError" hidden></p>
    <button class="video-close" id="videoClose" type="button">關閉</button>
  </div>

  <!-- 觀眾留言板（蛋糕頁「點開這裡」） -->
  <section class="board-layer" id="boardLayer" aria-label="大家的祝福" hidden>
    <header class="board-head">
      <h2 class="board-title">大家的祝福</h2>
      <p class="board-count" id="boardCount"></p>
    </header>
    <div class="board-cloud" id="boardCloud"></div>
    <p class="board-empty" id="boardEmpty" hidden>還沒有人留言</p>
    <div class="board-actions">
      <button class="board-btn" id="boardSave" type="button">保存成圖片</button>
      <button class="board-btn ghost" id="boardBack" type="button">回到信</button>
    </div>
  </section>

  <audio id="bgm" loop preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="main.js?v=12"></script>
  <script src="board.js?v=2"></script>
</body>
</html>
