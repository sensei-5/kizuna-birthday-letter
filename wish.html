<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>寫一句話給絆Kizuna</title>
  <meta name="description" content="在絆Kizuna的生日留言板寫下你的祝福">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%23e8b85c' d='M25 9a12 12 0 1 0 7 19a10 10 0 1 1-7-19z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
  <link rel="stylesheet" href="wish.css?v=5">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <canvas id="sky"></canvas>
    <div class="moon"><span class="moon-crater c1"></span><span class="moon-crater c2"></span><span class="moon-crater c3"></span></div>
    <svg class="guitar" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
      <g class="headstock">
        <path class="headstock-body" d="M-40 800 C 40 790, 120 780, 196 790 L 214 990 C 140 1000, 40 1010, -40 1020 Z"/>
        <rect class="nut" x="198" y="800" width="16" height="182" rx="3" transform="rotate(-4 206 891)"/>
        <g class="pegs">
          <circle cx="58" cy="826" r="13"/><circle cx="118" cy="818" r="13"/><circle cx="170" cy="812" r="13"/>
          <circle cx="58" cy="988" r="13"/><circle cx="118" cy="980" r="13"/><circle cx="170" cy="972" r="13"/>
        </g>
      </g>
      <g class="strings" id="strings"></g>
    </svg>
  </div>

  <main class="card">
    <p class="kicker">絆Kizuna 生日快樂</p>
    <h1>寫一句話給絆Kizuna</h1>

    <!-- 已截止 -->
    <p class="closed" id="closedNote" hidden>留言已截止，謝謝大家的祝福！</p>

    <!-- 載入中 -->
    <p class="status" id="loading">載入中…</p>

    <!-- 未登入 -->
    <section id="signedOut" hidden>
      <p class="lead">你的祝福會出現在生日信最後的留言板上，在直播中一起被看見。</p>
      <p class="note" id="loginNote">為了避免有人搗亂，請先登入再留言。</p>
      <div class="login-btns">
        <button class="login twitch" id="loginTwitch" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.3 3 3 6.4v13.1h4.5V22h2.5l2.4-2.5h3.7L21 14.6V3H4.3zm15 10.8-2.9 2.9h-4.5l-2.4 2.4v-2.4H5.7V4.7h13.6v9.1zM16.4 7.6v4.9h-1.7V7.6h1.7zm-4.6 0v4.9h-1.7V7.6h1.7z"/></svg>
          用 Twitch 登入
        </button>
        <button class="login google" id="loginGoogle" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
          用 Google（YT）登入
        </button>
      </div>
      <p class="fine">你的名字、頭像和留言會公開顯示。<a href="privacy.html">隱私權政策</a></p>
    </section>

    <!-- 已登入 -->
    <form id="wishForm" hidden novalidate>
      <div class="who">
        <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer">
        <div class="who-text">
          <span class="who-name" id="whoName"></span>
          <span class="who-via" id="whoVia"></span>
        </div>
        <button class="link-btn" id="logout" type="button">登出</button>
      </div>

      <p class="closed" id="deviceNote" hidden>這台裝置已經用另一個帳號留過言了，謝謝你的祝福！</p>

      <label class="field" id="nameField" hidden>
        <span class="field-label">顯示名稱（可以填你的 YT 名字）</span>
        <input id="nameInput" type="text" autocomplete="nickname" maxlength="30">
        <span class="field-hint" id="nameHint"></span>
      </label>

      <label class="field">
        <span class="field-label">想對絆說的話</span>
        <textarea id="messageInput" rows="4" placeholder="生日快樂！"></textarea>
        <span class="field-row"><span class="field-hint" id="saveHint"></span><span class="count" id="count"></span></span>
      </label>

      <p class="form-error" id="formError" role="alert" hidden></p>
      <button class="submit" id="submitBtn" type="submit">送出祝福</button>
    </form>

    <!-- 推廣：主播的 Twitch 頻道 -->
    <a class="channel" href="https://www.twitch.tv/edrain1109" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.3 3 3 6.4v13.1h4.5V22h2.5l2.4-2.5h3.7L21 14.6V3H4.3zm15 10.8-2.9 2.9h-4.5l-2.4 2.4v-2.4H5.7V4.7h13.6v9.1zM16.4 7.6v4.9h-1.7V7.6h1.7zm-4.6 0v4.9h-1.7V7.6h1.7z"/></svg>
      <span>到 Twitch 看絆Kizuna<span class="ch-more"> 的直播</span></span>
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="sky.js?v=1"></script>
  <script src="wish.js?v=4"></script>
</body>
</html>
